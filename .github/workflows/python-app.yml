name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONOPTIMIZE: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Pylint
        run: python -m pip install "pylint==4.1.3"
      - name: Check Python syntax
        run: python -m py_compile code/*.py
      - name: Run the published verifier
        run: python code/severance_audit_verifier.py
      - name: Check Python errors
        run: python -m pylint --errors-only --score=no --persistent=no code/*.py
      - name: Report style and other suggestions
        run: python -m pylint --exit-zero --score=no --persistent=no code/*.py
      - name: Check lint behaviour
        run: |
          control_dir="$(mktemp -d)"
          printf 'def get_binding():\n    return missing_binding\n' > "$control_dir/broken.py"
          if python -m pylint --errors-only --score=no --persistent=no "$control_dir/broken.py" > "$control_dir/errors.txt" 2>&1; then
            cat "$control_dir/errors.txt"
            exit 1
          fi
          grep -F 'E0602' "$control_dir/errors.txt"
          printf 'answer = 1\n' > "$control_dir/style.py"
          python -m pylint --errors-only --score=no --persistent=no "$control_dir/style.py"
          python -m pylint --exit-zero --score=no --persistent=no "$control_dir/style.py" > "$control_dir/style.txt"
          grep -F 'C0114' "$control_dir/style.txt"
